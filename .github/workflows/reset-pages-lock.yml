name: Reset GitHub Pages Lock

# 强制清掉卡住的 Pages 部署锁：先 cancel，再 unpublish + 重建为 Actions 发布
on:
  workflow_dispatch:

permissions:
  pages: write
  deployments: write
  contents: read
  actions: write

jobs:
  reset:
    runs-on: ubuntu-latest
    steps:
      - name: Cancel known stuck Pages deployments
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          set +e
          IDS=(
            "1a55148a4a14466c865ca39e76c869196360aa1f"
            "60ad0dd73cae8df0ef14cbe28c100539711f20a8"
            "70785421d882aa805778c0b6fc6c62ce4f9cac24"
            "03bbfb7eacdd4b97e718ab1a79cbd6db7eba4451"
          )
          for id in "${IDS[@]}"; do
            echo "=== cancel $id ==="
            curl -sS -X POST \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/$REPO/pages/deployments/$id/cancel" \
              -w "\nHTTP %{http_code}\n"
          done

      - name: Mark environment deployments inactive
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          set +e
          # 列出 github-pages 环境最近部署并标为 inactive，避免锁死
          curl -sS \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/$REPO/deployments?environment=github-pages&per_page=20" \
            > deps.json
          python3 - <<'PY'
          import json, os, urllib.request
          token = os.environ["GH_TOKEN"]
          repo = os.environ["REPO"]
          deps = json.load(open("deps.json", encoding="utf-8"))
          for d in deps:
              did = d["id"]
              req = urllib.request.Request(
                  f"https://api.github.com/repos/{repo}/deployments/{did}/statuses",
                  data=json.dumps({"state": "inactive", "description": "clear stuck lock"}).encode(),
                  headers={
                      "Authorization": f"Bearer {token}",
                      "Accept": "application/vnd.github+json",
                      "Content-Type": "application/json",
                      "X-GitHub-Api-Version": "2022-11-28",
                  },
                  method="POST",
              )
              try:
                  with urllib.request.urlopen(req) as r:
                      print(did, r.status)
              except Exception as e:
                  print(did, "ERR", e)
          PY

      - name: Unpublish then recreate Pages (workflow mode)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          set -e
          echo "=== DELETE pages (unpublish) ==="
          curl -sS -X DELETE \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$REPO/pages" \
            -w "\nHTTP %{http_code}\n" || true

          sleep 5

          echo "=== CREATE pages build_type=workflow ==="
          curl -sS -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$REPO/pages" \
            -d '{"build_type":"workflow"}' \
            -w "\nHTTP %{http_code}\n"

          echo "=== restore CNAME www.code-corey.com ==="
          curl -sS -X PUT \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$REPO/pages" \
            -d '{"cname":"www.code-corey.com","build_type":"workflow"}' \
            -w "\nHTTP %{http_code}\n" || true
